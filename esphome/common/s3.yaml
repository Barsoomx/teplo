# ESP32-S3-DevKitC-1 N16R8 with a U.FL antenna. The module has no antenna of its own, so the external one carries
# every frame at full transmit power. Its RGB LED is addressable, so the board has no status LED.
# The octal PSRAM takes GPIO35-37: keep sensors off those pins.
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: n
