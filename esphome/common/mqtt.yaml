mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: teplo/${node_name}
  discovery: false
  log_topic: null
  publish_nan_as_none: false
  # A SuperMini can hang with Wi-Fi still associated and nothing passing; a restart brings it back.
  reboot_timeout: 5min
  # A weak link loses a ping reply now and then; with the default 15 s the session drops over it.
  keepalive: 60s
  birth_message:
    topic: teplo/${node_name}/status
    payload: online
    retain: false
  will_message:
    topic: teplo/${node_name}/status
    payload: offline
    retain: false
  shutdown_message:
    topic: teplo/${node_name}/status
    payload: offline
    retain: false
