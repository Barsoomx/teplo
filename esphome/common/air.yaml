# SHT30 on I2C. A failed read publishes nothing, so once a reading has gone out the timeout publishes nan after two
# missed updates.
# The SuperMini's pins; a node on another board sets i2c_sda and i2c_scl in its own substitutions.
substitutions:
  i2c_sda: GPIO0
  i2c_scl: GPIO1

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true

sensor:
  - platform: sht3xd
    id: sht30
    address: 0x44
    update_interval: 30s
    temperature:
      id: air_temperature
      name: Temperature
      accuracy_decimals: 1
      state_topic: teplo/${node_name}/sensor/temperature/state
      retain: false
      qos: 0
      filters:
        - timeout: 75s
    humidity:
      id: air_humidity
      name: Humidity
      accuracy_decimals: 1
      state_topic: teplo/${node_name}/sensor/humidity/state
      retain: false
      qos: 0
      filters:
        - timeout: 75s

# An SHT30 that does not answer at boot leaves sht3xd failed: it reads nothing until the node restarts, and without a
# first reading the timeout never starts.
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (id(sht30).is_failed()) {
            id(air_temperature).publish_state(NAN);
            id(air_humidity).publish_state(NAN);
          }
