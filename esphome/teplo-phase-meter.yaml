# ESP32-S3-DevKitC-1 with three SCT-013-050 clamps (1 V RMS at 50 A) biased at 1.65 V on ADC1, and a U.FL antenna
# outside the shed's metal door. multiply: 50 is the clamps' nominal ratio; docs/deploy.md calibrates it.
substitutions:
  node_name: teplo-phase-meter
  friendly_name: Phase meter
  l1_pin: GPIO4
  l2_pin: GPIO5
  l3_pin: GPIO6

packages:
  node: !include common/node.yaml
  s3: !include common/s3.yaml

sensor:
  - platform: adc
    id: l1_clamp
    pin: ${l1_pin}
    attenuation: 12db
    update_interval: never
  - platform: adc
    id: l2_clamp
    pin: ${l2_pin}
    attenuation: 12db
    update_interval: never
  - platform: adc
    id: l3_clamp
    pin: ${l3_pin}
    attenuation: 12db
    update_interval: never

  - platform: ct_clamp
    sensor: l1_clamp
    name: L1 current
    sample_duration: 200ms
    update_interval: 1s
    accuracy_decimals: 2
    state_topic: teplo/${node_name}/sensor/l1_current/state
    retain: false
    qos: 0
    filters:
      - multiply: 50
  - platform: ct_clamp
    sensor: l2_clamp
    name: L2 current
    sample_duration: 200ms
    update_interval: 1s
    accuracy_decimals: 2
    state_topic: teplo/${node_name}/sensor/l2_current/state
    retain: false
    qos: 0
    filters:
      - multiply: 50
  - platform: ct_clamp
    sensor: l3_clamp
    name: L3 current
    sample_duration: 200ms
    update_interval: 1s
    accuracy_decimals: 2
    state_topic: teplo/${node_name}/sensor/l3_current/state
    retain: false
    qos: 0
    filters:
      - multiply: 50
