substitutions:
  node_name: teplo-outdoor
  friendly_name: Outdoor

packages:
  node: !include common/node.yaml
  devkit: !include common/devkit.yaml

# The street probe's adapter pulls its 1-Wire line up to 3.3 V with its own 4.7 kΩ.
one_wire:
  - platform: gpio
    id: outdoor_bus
    pin: GPIO4

# An SHT30 in the water filter box, which may freeze in winter: the box's air and humidity.
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: dallas_temp
    one_wire_id: outdoor_bus
    id: outdoor_temperature
    name: Temperature
    update_interval: 30s
    accuracy_decimals: 1
    state_topic: teplo/${node_name}/sensor/temperature/state
    retain: false
    qos: 0
  # A failed read publishes nothing, so once a reading has gone out the timeout publishes nan after two missed
  # updates.
  - platform: sht3xd
    id: box_sht30
    address: 0x44
    update_interval: 30s
    temperature:
      id: box_temperature
      name: Box temperature
      accuracy_decimals: 1
      state_topic: teplo/${node_name}/sensor/box_temperature/state
      retain: false
      qos: 0
      filters:
        - timeout: 75s
    humidity:
      id: box_humidity
      name: Box humidity
      accuracy_decimals: 1
      state_topic: teplo/${node_name}/sensor/box_humidity/state
      retain: false
      qos: 0
      filters:
        - timeout: 75s

interval:
  - interval: 30s
    then:
      # The bus searches for the DS18B20 only at boot, and a sensor it did not find reads nothing. While it is
      # missing, search again and publish nan.
      - lambda: |-
          auto *bus = id(outdoor_bus);
          if (!bus->get_devices().empty())
            return;

          bus->search();
          if (bus->get_devices().size() == 1) {
            id(outdoor_temperature).set_address(bus->get_devices().front());
            return;
          }

          id(outdoor_temperature).publish_state(NAN);
      # An SHT30 that does not answer at boot leaves sht3xd failed until the node restarts, and without a first
      # reading the timeout never starts.
      - lambda: |-
          if (id(box_sht30).is_failed()) {
            id(box_temperature).publish_state(NAN);
            id(box_humidity).publish_state(NAN);
          }
