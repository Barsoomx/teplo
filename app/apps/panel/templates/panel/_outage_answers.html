{% load i18n panel_format %}<fieldset class="answers" hx-target="{{ target }}" hx-swap="{{ swap }}" hx-disabled-elt="this">
  <legend class="visually-hidden">{% translate 'What was it?' %}</legend>
  {% if outage.overload and outage.cause == 'unmarked' %}
  <button class="answer answer-suggested" type="button" name="cause" value="overload" hx-post="{{ action }}" aria-describedby="outage-{{ outage.id }}-overload">{% icon 'zap' %}{% translate 'Overload: our breaker tripped' %}</button>
  {% else %}
  <button class="answer" type="button" name="cause" value="overload" hx-post="{{ action }}"{% if outage.cause == 'overload' %} aria-pressed="true"{% endif %}>{% translate 'Overload: our breaker tripped' %}</button>
  {% endif %}
  <button class="answer" type="button" name="cause" value="grid" hx-post="{{ action }}"{% if outage.cause == 'grid' %} aria-pressed="true"{% endif %}>{% translate 'Out in the village' %}</button>
  <button class="answer" type="button" name="cause" value="unknown" hx-post="{{ action }}"{% if outage.cause == 'unknown' %} aria-pressed="true"{% endif %}>{% translate 'Not sure' %}</button>
</fieldset>
