name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: settings.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-root --no-interaction
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy app
      - name: Migrations are up to date
        run: poetry run python app/manage.py makemigrations --check --dry-run
      - name: Tests
        run: poetry run pytest
      - name: Site migrations apply
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3 poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import ComfortPeriod, Zone; from apps.devices.models import Device; assert (Device.objects.count(), Zone.objects.count(), Zone.objects.filter(kind='air').count(), ComfortPeriod.objects.count()) == (16, 5, 3, 35)"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.climate_settings import ClimateSettingsRepository; from apps.climate.repositories.zone import ZoneRepository; from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; sensors = ClimateSettingsRepository.sensors(); assert ([(zone.slug, zone.air_sensor_slug) for zone in ZoneRepository.all_settings() if zone.air_sensor_slug], DeviceRepository.slugs_with_driver(DeviceDriver.ESPHOME_PHASE_METER), sensors.outdoor_slug) == ([('hallway', 'air-hallway'), ('kitchen', 'air-kitchen'), ('living-room', 'air-living-room')], ['phase-meter'], 'outdoor')"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.models import ComfortPeriod; from apps.climate.repositories.room_climate import RoomClimateRepository; from apps.climate.repositories.zone import ZoneRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; bedroom = rooms['bedroom']; assert ([(zone.slug, zone.air_control_live, zone.air_targets.comfort, zone.air_targets.night, zone.setpoints.idle, zone.setpoints.limit) for zone in ZoneRepository.all_settings() if zone.kind == 'air'], list(rooms), (bedroom.air_sensor_slug, bedroom.backup.zone_slug, bedroom.backup.below, bedroom.backup.hysteresis, bedroom.backup.live, bedroom.targets.comfort, bedroom.targets.night), (rooms['office'].targets.comfort, rooms['office'].targets.night), len(rooms['open-space'].windows), ComfortPeriod.objects.count()) == ([(slug, False, Decimal('22.0'), Decimal('19.5'), Decimal('18.0'), Decimal('30.0')) for slug in ('hallway', 'kitchen', 'living-room')], ['open-space', 'bathroom-1f', 'bedroom', 'office', 'bathroom-2f'], ('air-second-floor', 'bathroom-2f', Decimal('19.0'), Decimal('0.30'), False, Decimal('20.5'), Decimal('19.5')), (Decimal('21.5'), Decimal('19.0')), 7, 35)"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; assert (list(rooms), rooms['bedroom'].backup.zone_slug, rooms['bedroom'].air_sensor_slug, len(rooms['living-room'].windows)) == (['living-room', 'bathroom', 'bedroom'], 'bathroom', 'air-second-floor', 7)"
          for site in example:living-room barsoom:open-space; do
            TEPLO_SITE=${site%%:*} TEPLO_DB_PATH=/tmp/teplo-${site%%:*}.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.domain.room_intent import GuestsRecord; from apps.climate.repositories.climate_settings import ClimateSettingsRepository; from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = RoomClimateRepository.all_settings(); assert ([room.slug for room in rooms if room.guest_room], [room.slug for room in rooms if room.adjustable], [room.slug for room in rooms if room.override is not None], ClimateSettingsRepository.guests()) == (['${site#*:}'], ['${site#*:}'], [], GuestsRecord(until=None, end_hour=14))"
          done
          for site in example barsoom; do
            TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.repositories.climate_settings import ClimateSettingsRepository; regulation = ClimateSettingsRepository.control().regulation; assert (regulation.start_offset, regulation.initial_early_stop_offset, regulation.min_band) == (Decimal('0.3'), Decimal('0.3'), Decimal('0.2'))"
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.power.repositories.load import LoadRepository; from apps.power.repositories.load_settings import LoadSettingsRepository; control = LoadSettingsRepository.control(); assert ([(load.slug, load.kind, load.device_slug, load.priority, load.phase, load.nominal_amps, load.live) for load in LoadRepository.all_records()], control.live, control.thresholds.start_ceiling, control.thresholds.shed, control.thresholds.restore, control.default_amps) == ([('boiler-1f', 'plug', 'plug-boiler-1f', 1, 'unknown', Decimal('6.0'), False), ('boiler-2f', 'plug', 'plug-boiler-2f', 2, 'unknown', Decimal('6.0'), False), ('bathroom-1f', 'zone', 'thermostat-bathroom-1f', 3, 'unknown', None, False), ('hallway', 'zone', 'thermostat-hallway', 4, 'unknown', None, False), ('kitchen', 'zone', 'thermostat-kitchen', 5, 'unknown', None, False), ('bathroom-2f', 'zone', 'thermostat-bathroom-2f', 6, 'unknown', None, False), ('living-room', 'zone', 'thermostat-living-room', 7, 'unknown', None, False)], False, Decimal('20.0'), Decimal('24.0'), Decimal('18.0'), Decimal('6.0'))"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.power.repositories.load import LoadRepository; assert [(load.slug, load.device_slug, load.priority) for load in LoadRepository.all_records()] == [('water-heater', 'plug-water-heater', 1), ('bathroom', 'thermostat-bathroom', 2), ('living-room', 'thermostat-living-room', 3)]"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; assert (DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_SWITCHABLE_PLUG), DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_PLUG)) == (['plug-boiler-1f', 'plug-boiler-2f'], ['plug-dishwasher', 'plug-oven', 'plug-washing-machine'])"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; assert (DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_SWITCHABLE_PLUG), DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_PLUG)) == (['plug-water-heater'], [])"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import Zone; from apps.devices.models import Device; from apps.house.repositories.house import HouseRepository; assert ([(floor.slug, floor.level, [room.slug for room in floor.rooms]) for floor in HouseRepository.floors()], sorted(Zone.objects.values_list('slug', 'room__slug')), sorted(Device.objects.values_list('slug', 'room__slug')), Device.objects.get(slug='air-second-floor').name, sorted(Device.objects.filter(monitor_only=True).values_list('slug', flat=True))) == ([('floor-1', 1, ['open-space', 'bathroom-1f']), ('floor-2', 2, ['bedroom', 'office', 'bathroom-2f'])], [('bathroom-1f', 'bathroom-1f'), ('bathroom-2f', 'bathroom-2f'), ('hallway', 'open-space'), ('kitchen', 'open-space'), ('living-room', 'open-space')], [('air-hallway', 'open-space'), ('air-kitchen', 'open-space'), ('air-living-room', 'open-space'), ('air-second-floor', 'bedroom'), ('outdoor', None), ('phase-meter', None), ('plug-boiler-1f', 'bathroom-1f'), ('plug-boiler-2f', 'bathroom-2f'), ('plug-dishwasher', 'open-space'), ('plug-oven', 'open-space'), ('plug-washing-machine', 'bathroom-1f'), ('thermostat-bathroom-1f', 'bathroom-1f'), ('thermostat-bathroom-2f', 'bathroom-2f'), ('thermostat-hallway', 'open-space'), ('thermostat-kitchen', 'open-space'), ('thermostat-living-room', 'open-space')], 'Воздух: спальня', ['plug-dishwasher', 'plug-oven', 'plug-washing-machine'])"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import Zone; from apps.devices.models import Device; from apps.house.repositories.house import HouseRepository; assert ([(floor.slug, [room.slug for room in floor.rooms]) for floor in HouseRepository.floors()], sorted(Zone.objects.values_list('slug', 'room__slug')), sorted(Device.objects.values_list('slug', 'room__slug')), Device.objects.get(slug='air-second-floor').name) == ([('floor-1', ['living-room', 'bathroom']), ('floor-2', ['bedroom'])], [('bathroom', 'bathroom'), ('living-room', 'living-room')], [('air-living-room', 'living-room'), ('air-second-floor', 'bedroom'), ('outdoor', None), ('phase-meter', None), ('plug-water-heater', 'bathroom'), ('thermostat-bathroom', 'bathroom'), ('thermostat-living-room', 'living-room')], 'Bedroom air sensor')"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.house.repositories.house import HouseRepository; bathroom = ('санузел', 'санузл', 'ванн', 'туалет'); assert [(room.slug, room.aliases) for room in HouseRepository.rooms()] == [('open-space', ('гостин', 'кухн', 'прихож', 'зал')), ('bathroom-1f', bathroom), ('bedroom', ('спальн',)), ('office', ('кабинет', 'офис')), ('bathroom-2f', bathroom)]"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.house.repositories.house import HouseRepository; assert [(room.slug, room.aliases) for room in HouseRepository.rooms()] == [('living-room', ('living', 'гостин')), ('bathroom', ('bath', 'ванн', 'санузел', 'санузл')), ('bedroom', ('bed', 'спальн'))]"
