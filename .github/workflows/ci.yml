name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: settings.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-root --no-interaction
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy app
      - name: Migrations are up to date
        run: poetry run python app/manage.py makemigrations --check --dry-run
      - name: Tests
        run: poetry run pytest
      - name: Site migrations apply
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3 poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import ComfortPeriod, Zone; from apps.devices.models import Device; assert (Device.objects.count(), Zone.objects.count(), Zone.objects.filter(kind='air').count(), ComfortPeriod.objects.count()) == (17, 5, 3, 63)"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.climate_settings import ClimateSettingsRepository; from apps.climate.repositories.zone import ZoneRepository; from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; sensors = ClimateSettingsRepository.sensors(); assert ([(zone.slug, zone.air_sensor_slug) for zone in ZoneRepository.all_settings() if zone.air_sensor_slug], DeviceRepository.slugs_with_driver(DeviceDriver.ESPHOME_PHASE_METER), sensors.outdoor_slug) == ([('hallway', 'air-hallway'), ('kitchen', 'air-kitchen'), ('living-room', 'air-living-room')], ['phase-meter'], 'outdoor')"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.models import ComfortPeriod; from apps.climate.repositories.room_climate import RoomClimateRepository; from apps.climate.repositories.zone import ZoneRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; bedroom = rooms['bedroom']; assert ([(zone.slug, zone.air_control_live, zone.air_targets.comfort, zone.air_targets.night, zone.setpoints.idle, zone.setpoints.limit) for zone in ZoneRepository.all_settings() if zone.kind == 'air'], list(rooms), (bedroom.air_sensor_slug, bedroom.backup.zone_slug, bedroom.backup.below, bedroom.backup.hysteresis, bedroom.backup.live, bedroom.targets.comfort, bedroom.targets.night), (rooms['office'].targets.comfort, rooms['office'].targets.night), len(rooms['open-space'].windows), ComfortPeriod.objects.count()) == ([(slug, False, Decimal('22.0'), Decimal('19.5'), Decimal('18.0'), Decimal('30.0')) for slug in ('hallway', 'kitchen', 'living-room')], ['open-space', 'bathroom-1f', 'bedroom', 'office', 'bathroom-2f'], ('air-second-floor', 'bathroom-2f', Decimal('19.0'), Decimal('0.30'), False, Decimal('20.5'), Decimal('19.5')), (Decimal('21.5'), Decimal('19.0')), 7, 63)"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; assert (list(rooms), rooms['bedroom'].backup.zone_slug, rooms['bedroom'].air_sensor_slug, len(rooms['living-room'].windows)) == (['living-room', 'bathroom', 'bedroom'], 'bathroom', 'air-second-floor', 7)"
          for site in example:living-room:living-room barsoom:open-space:open-space,office; do
            name=${site%%:*}
            rooms=${site#*:}
            TEPLO_SITE=$name TEPLO_DB_PATH=/tmp/teplo-$name.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.domain.room_intent import GuestsRecord; from apps.climate.repositories.climate_settings import ClimateSettingsRepository; from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = RoomClimateRepository.all_settings(); assert ([room.slug for room in rooms if room.guest_room], [room.slug for room in rooms if room.adjustable], [room.slug for room in rooms if room.override is not None], ClimateSettingsRepository.guests()) == (['${rooms%%:*}'], '${rooms#*:}'.split(','), [], GuestsRecord(until=None, end_hour=14))"
          done
          for site in example barsoom; do
            TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.repositories.climate_settings import ClimateSettingsRepository; regulation = ClimateSettingsRepository.control().regulation; assert (regulation.start_offset, regulation.initial_early_stop_offset, regulation.min_band) == (Decimal('0.3'), Decimal('0.3'), Decimal('0.2'))"
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.power.domain.control import EstimateSettings; from apps.power.domain.loads import LoadPhase; from apps.power.repositories.load import LoadRepository; from apps.power.repositories.load_settings import LoadSettingsRepository; control = LoadSettingsRepository.control(); assert ([(load.slug, load.kind, load.device_slug, load.priority, load.phase, load.nominal_amps, load.live) for load in LoadRepository.all_records()], control.live, control.thresholds.start_ceiling, control.thresholds.shed, control.thresholds.restore, control.default_amps, control.estimate) == ([('boiler-1f', 'plug', 'plug-boiler-1f', 1, 'unknown', Decimal('6.0'), False), ('boiler-2f', 'plug', 'plug-boiler-2f', 2, 'l2', Decimal('6.0'), False), ('bathroom-1f', 'zone', 'thermostat-bathroom-1f', 3, 'l2', None, False), ('hallway', 'zone', 'thermostat-hallway', 4, 'unknown', None, False), ('kitchen', 'zone', 'thermostat-kitchen', 5, 'unknown', None, False), ('bathroom-2f', 'zone', 'thermostat-bathroom-2f', 6, 'unknown', None, False), ('living-room', 'zone', 'thermostat-living-room', 7, 'unknown', None, False), ('convector-office', 'source', 'heater-office', 8, 'l2', None, False)], False, Decimal('20.0'), Decimal('24.0'), Decimal('18.0'), Decimal('6.0'), EstimateSettings(phase=LoadPhase.L2, base_amps=Decimal('2.0')))"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.power.domain.control import NO_ESTIMATE; from apps.power.repositories.load import LoadRepository; from apps.power.repositories.load_settings import LoadSettingsRepository; assert ([(load.slug, load.device_slug, load.priority, load.phase) for load in LoadRepository.all_records()], LoadSettingsRepository.control().estimate) == ([('water-heater', 'plug-water-heater', 1, 'unknown'), ('bathroom', 'thermostat-bathroom', 2, 'unknown'), ('living-room', 'thermostat-living-room', 3, 'unknown')], NO_ESTIMATE)"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; assert (DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_SWITCHABLE_PLUG), DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_PLUG), DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_HEATER)) == (['plug-boiler-1f', 'plug-boiler-2f'], ['plug-dishwasher', 'plug-oven', 'plug-washing-machine'], ['heater-office'])"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.devices.domain.kinds import DeviceDriver; from apps.devices.repositories.device import DeviceRepository; assert (DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_SWITCHABLE_PLUG), DeviceRepository.slugs_with_driver(DeviceDriver.TUYA_PLUG)) == (['plug-water-heater'], [])"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import Zone; from apps.devices.models import Device; from apps.house.repositories.house import HouseRepository; assert ([(floor.slug, floor.level, [room.slug for room in floor.rooms]) for floor in HouseRepository.floors()], sorted(Zone.objects.values_list('slug', 'room__slug')), sorted(Device.objects.values_list('slug', 'room__slug')), Device.objects.get(slug='air-second-floor').name, sorted(Device.objects.filter(monitor_only=True).values_list('slug', flat=True))) == ([('floor-1', 1, ['open-space', 'bathroom-1f']), ('floor-2', 2, ['bedroom', 'office', 'bathroom-2f'])], [('bathroom-1f', 'bathroom-1f'), ('bathroom-2f', 'bathroom-2f'), ('hallway', 'open-space'), ('kitchen', 'open-space'), ('living-room', 'open-space')], [('air-hallway', 'open-space'), ('air-kitchen', 'open-space'), ('air-living-room', 'open-space'), ('air-second-floor', 'bedroom'), ('heater-office', 'office'), ('outdoor', None), ('phase-meter', None), ('plug-boiler-1f', 'bathroom-1f'), ('plug-boiler-2f', 'bathroom-2f'), ('plug-dishwasher', 'open-space'), ('plug-oven', 'open-space'), ('plug-washing-machine', 'bathroom-1f'), ('thermostat-bathroom-1f', 'bathroom-1f'), ('thermostat-bathroom-2f', 'bathroom-2f'), ('thermostat-hallway', 'open-space'), ('thermostat-kitchen', 'open-space'), ('thermostat-living-room', 'open-space')], 'Воздух: спальня', ['plug-dishwasher', 'plug-oven', 'plug-washing-machine'])"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import Zone; from apps.devices.models import Device; from apps.house.repositories.house import HouseRepository; assert ([(floor.slug, [room.slug for room in floor.rooms]) for floor in HouseRepository.floors()], sorted(Zone.objects.values_list('slug', 'room__slug')), sorted(Device.objects.values_list('slug', 'room__slug')), Device.objects.get(slug='air-second-floor').name) == ([('floor-1', ['living-room', 'bathroom']), ('floor-2', ['bedroom'])], [('bathroom', 'bathroom'), ('living-room', 'living-room')], [('air-living-room', 'living-room'), ('air-second-floor', 'bedroom'), ('heater-office', 'office'), ('outdoor', None), ('phase-meter', None), ('plug-water-heater', 'bathroom'), ('thermostat-bathroom', 'bathroom'), ('thermostat-living-room', 'living-room')], 'Bedroom air sensor')"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.house.repositories.house import HouseRepository; bathroom = ('санузел', 'санузл', 'ванн', 'туалет'); assert [(room.slug, room.aliases) for room in HouseRepository.rooms()] == [('open-space', ('гостин', 'кухн', 'прихож', 'зал')), ('bathroom-1f', bathroom), ('bedroom', ('спальн',)), ('office', ('кабинет', 'офис')), ('bathroom-2f', bathroom)]"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.house.repositories.house import HouseRepository; assert [(room.slug, room.aliases) for room in HouseRepository.rooms()] == [('living-room', ('living', 'гостин')), ('bathroom', ('bath', 'ванн', 'санузел', 'санузл')), ('bedroom', ('bed', 'спальн'))]"
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.models import HeatSource, ZoneLearning; assert (list(HeatSource.objects.values_list('slug', 'room__slug', 'kind', 'live')), list(HeatSource.objects.values_list('device__slug', 'priority', 'lit_until')), list(HeatSource.objects.filter(kind='heater').values_list('setpoint_bias', 'max_setpoint', 'min_write_minutes', 'rated_watts')), ZoneLearning.objects.exclude(resets=0).exists()) == ([('fireplace', 'open-space', 'fireplace', False), ('convector-office', 'office', 'heater', False)], [(None, 1, None), ('heater-office', 1, None)], [(Decimal('0.0'), Decimal('24.0'), 5, 2000)], False)"
          TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import HeatSource; assert not HeatSource.objects.exists()"
      - name: Site migrations stop before a room loses its comfort or the bedroom its backup heat
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          sql() { poetry run python app/manage.py shell -c "from django.db import connection; connection.cursor().execute(\"$1\")"; }
          refused() { if poetry run python app/manage.py migrate "$@" --noinput 2> /tmp/refused.log; then echo 'migrate went through'; exit 1; fi; tail -n 1 /tmp/refused.log; }
          export TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom-lounge.sqlite3
          poetry run python app/manage.py migrate site_barsoom 0007 --noinput
          sql "UPDATE climate_zone SET slug = 'lounge' WHERE slug = 'living-room'"
          refused
          grep -q 'the room open-space holds the zones hallway, kitchen but no zone living-room' /tmp/refused.log
          poetry run python app/manage.py shell -c "from apps.climate.models import RoomClimate; assert not RoomClimate.objects.exists()"
          sql "UPDATE climate_zone SET slug = 'living-room', room_id = (SELECT id FROM house_room WHERE slug = 'open-space') WHERE slug = 'lounge'"
          poetry run python app/manage.py migrate --noinput
          poetry run python app/manage.py shell -c "from apps.climate.models import ComfortPeriod; from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; assert (len(rooms['open-space'].windows), len(rooms['office'].windows), ComfortPeriod.objects.count()) == (7, 7, 63)"
          export TEPLO_SITE=example TEPLO_DB_PATH=/tmp/teplo-example-lounge.sqlite3
          poetry run python app/manage.py migrate site_example 0008 --noinput
          sql "UPDATE climate_zone SET slug = 'lounge' WHERE slug = 'living-room'"
          refused
          grep -q 'the room living-room holds the zones lounge but no zone living-room' /tmp/refused.log
          poetry run python app/manage.py shell -c "from apps.climate.models import RoomClimate; assert not RoomClimate.objects.exists()"
          sql "UPDATE climate_zone SET slug = 'living-room' WHERE slug = 'lounge'"
          poetry run python app/manage.py migrate --noinput
          poetry run python app/manage.py shell -c "from apps.climate.repositories.room_climate import RoomClimateRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; assert len(rooms['living-room'].windows) == 7"
          for site in example:bathroom barsoom:bathroom-2f; do
            name=${site%%:*}
            cp /tmp/teplo-$name.sqlite3 /tmp/teplo-$name-renamed-bedroom.sqlite3
            export TEPLO_SITE=$name TEPLO_DB_PATH=/tmp/teplo-$name-renamed-bedroom.sqlite3
            poetry run python app/manage.py shell -c "from apps.climate.models import RoomClimate; from apps.house.models import Room; RoomClimate.objects.filter(room__slug='bedroom').update(backup_below='18.5', backup_live=True); Room.objects.filter(slug='bedroom').update(slug='master-bedroom')"
            refused climate 0009
            grep -q 'no room has the slug bedroom' /tmp/refused.log
            poetry run python app/manage.py shell -c "from apps.climate.models import RoomClimate; assert RoomClimate.objects.filter(room__slug='master-bedroom', backup_zone__slug='${site#*:}').exists()"
            poetry run python app/manage.py shell -c "from apps.house.models import Room; Room.objects.filter(slug='master-bedroom').update(slug='bedroom')"
            poetry run python app/manage.py migrate climate 0009 --noinput
            poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.climate.models import ClimateSettings; assert list(ClimateSettings.objects.values_list('second_floor_sensor__slug', 'second_floor_guard_zone__slug', 'second_floor_guard_threshold', 'second_floor_guard_live')) == [('air-second-floor', '${site#*:}', Decimal('18.5'), True)]"
            cp /tmp/teplo-$name.sqlite3 /tmp/teplo-$name-bedroomless.sqlite3
            export TEPLO_DB_PATH=/tmp/teplo-$name-bedroomless.sqlite3
            poetry run python app/manage.py shell -c "from apps.house.models import Room; Room.objects.filter(slug='bedroom').delete()"
            poetry run python app/manage.py migrate climate 0009 --noinput
            poetry run python app/manage.py shell -c "from apps.climate.models import ClimateSettings; assert list(ClimateSettings.objects.values_list('second_floor_sensor', 'second_floor_guard_zone')) == [(None, None)]"
          done
      - name: Site migrations roll back past the house
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            export TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3
            poetry run python app/manage.py shell -c "from apps.house.models import Floor, Room; Room.objects.create(slug='wardrobe', name='Гардероб', floor=Floor.objects.get(slug='floor-2'), position=9)"
            poetry run python app/manage.py migrate climate 0008 --noinput
            poetry run python app/manage.py migrate devices 0002 --noinput
            poetry run python app/manage.py migrate house zero --noinput
            poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import ComfortPeriod; from apps.climate.repositories.room_climate import RoomClimateRepository; from apps.house.repositories.house import HouseRepository; rooms = {room.slug: room for room in RoomClimateRepository.all_settings()}; assert ([(floor.slug, [room.slug for room in floor.rooms]) for floor in HouseRepository.floors()], len(rooms['open-space'].windows), ComfortPeriod.objects.count()) == ([('floor-1', ['open-space', 'bathroom-1f']), ('floor-2', ['bedroom', 'office', 'bathroom-2f'])], 7, 63)"
      - name: Site migrations roll back past the L2 estimate
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            cp /tmp/teplo-$site.sqlite3 /tmp/teplo-$site-estimate.sqlite3
            export TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site-estimate.sqlite3
            poetry run python app/manage.py migrate power 0006 --noinput
            poetry run python app/manage.py shell -c "from apps.power.models import Load; assert sorted(Load.objects.exclude(phase='unknown').values_list('slug', 'phase')) == ([('bathroom-1f', 'l2'), ('boiler-2f', 'l2')] if '$site' == 'barsoom' else [])"
            poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom-estimate.sqlite3 poetry run python app/manage.py shell -c "from decimal import Decimal; from apps.power.domain.control import EstimateSettings; from apps.power.domain.loads import LoadPhase; from apps.power.repositories.load_settings import LoadSettingsRepository; assert LoadSettingsRepository.control().estimate == EstimateSettings(phase=LoadPhase.L2, base_amps=Decimal('2.0'))"
      - name: Site migrations roll back past the heat sources
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            cp /tmp/teplo-$site.sqlite3 /tmp/teplo-$site-heat-sources.sqlite3
            export TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site-heat-sources.sqlite3
            poetry run python app/manage.py migrate climate 0011 --noinput
            poetry run python app/manage.py shell -c "from django.db import connection; cursor = connection.cursor(); assert ('climate_heatsource' in connection.introspection.table_names(), 'resets' in [column.name for column in connection.introspection.get_table_description(cursor, 'climate_zonelearning')]) == (False, False)"
            poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom-heat-sources.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.heat_source import HeatSourceRepository; assert [(fireplace.slug, fireplace.room_slug, fireplace.live, fireplace.lit_until) for fireplace in HeatSourceRepository.fireplaces()] == [('fireplace', 'open-space', False, None)]"
      - name: Site migrations roll back past the manual hold
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            cp /tmp/teplo-$site.sqlite3 /tmp/teplo-$site-manual-hold.sqlite3
            export TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site-manual-hold.sqlite3
            poetry run python app/manage.py migrate climate 0012 --noinput
            poetry run python app/manage.py shell -c "from django.db import connection; cursor = connection.cursor(); columns = lambda table: [column.name for column in connection.introspection.get_table_description(cursor, table)]; assert ('manual_until' in columns('climate_zone'), 'manual_hold_live' in columns('climate_climatesettings')) == (False, False)"
            poetry run python app/manage.py migrate --noinput
            poetry run python app/manage.py shell -c "from apps.climate.domain.control import ClimateGates; from apps.climate.repositories.climate_settings import ClimateSettingsRepository; from apps.climate.repositories.zone import ZoneRepository; assert (ClimateSettingsRepository.gates(), {zone.manual_until for zone in ZoneRepository.all_settings()}) == (ClimateGates(manual_hold_live=False), {None})"
          done
      - name: Site migrations roll back past the office convector
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            cp /tmp/teplo-$site.sqlite3 /tmp/teplo-$site-convector.sqlite3
            export TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site-convector.sqlite3
            poetry run python app/manage.py migrate climate 0013 --noinput
            poetry run python app/manage.py migrate devices 0003 --noinput
            poetry run python app/manage.py shell -c "from django.db import connection; from apps.climate.models import ComfortPeriod; from apps.devices.models import Device; from apps.power.models import Load; cursor = connection.cursor(); columns = lambda table: [column.name for column in connection.introspection.get_table_description(cursor, table)]; assert ('heat_source_id' in columns('power_load'), 'commanded_power' in columns('climate_heatsource'), Device.objects.filter(slug='heater-office').exists(), Load.objects.filter(kind='source').exists(), ComfortPeriod.objects.filter(room_climate__room__slug='office').exists()) == (False, False, False, False, False)"
            poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom-convector.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.repositories.heat_source import HeatSourceRepository; from apps.power.repositories.load import LoadRepository; assert ([(source.slug, source.device_slug, source.load, source.live) for source in HeatSourceRepository.commanded_settings()], [(load.slug, load.priority) for load in LoadRepository.all_records()][-1]) == ([('convector-office', 'heater-office', 'convector-office', False)], ('convector-office', 8))"
