name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: settings.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-root --no-interaction
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy app
      - name: Migrations are up to date
        run: poetry run python app/manage.py makemigrations --check --dry-run
      - name: Tests
        run: poetry run pytest
      - name: Site migrations apply
        env:
          DJANGO_SETTINGS_MODULE: settings.settings
          DJANGO_SECRET_KEY: ci-site-migrations-only
        run: |
          for site in example barsoom; do
            TEPLO_SITE=$site TEPLO_DB_PATH=/tmp/teplo-$site.sqlite3 poetry run python app/manage.py migrate --noinput
          done
          TEPLO_SITE=barsoom TEPLO_DB_PATH=/tmp/teplo-barsoom.sqlite3 poetry run python app/manage.py shell -c "from apps.climate.models import ComfortPeriod, Zone; from apps.devices.models import Device; assert (Device.objects.count(), Zone.objects.count(), Zone.objects.filter(kind='air').count(), ComfortPeriod.objects.count()) == (7, 5, 3, 35)"
